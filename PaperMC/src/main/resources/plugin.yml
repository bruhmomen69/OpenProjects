name: MiniMessageChatPlugin
main: lol.mcplugs.minimessagechatplugin.paper.PaperMC
version: ${version}
api-version: '1.20'
author: MCPlugs
description: A highly configurable kyori adventure (minimessage) powered chat formatting plugin
website: https://github.com/mcplugs/minimessage-chat-plugin
load: STARTUP
libraries:
  - org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.0.0
  - org.spongepowered:configurate-hocon:4.1.2
  - io.github.revxrsal:lamp.common:4.0.0-rc.12
  - io.github.revxrsal:lamp.bukkit:4.0.0-rc.12

softdepend:
  - PlaceholderAPI

commands:
  chatplugin:
    description: Main command for MiniMessage Chat Plugin
    usage: /chatplugin <subcommand>
    permission: chatplugin.admin
    aliases: [chatformat]

  msg:
    description: Send a private message to another player
    usage: /msg <player> <message>
    permission: chatplugin.message
    aliases: [message, tell, whisper, w]
  
  reply:
    description: Reply to the last player who sent you a message
    usage: /reply <message>
    permission: chatplugin.message
    aliases: [r]

permissions:
  chatplugin.*:
    description: All ChatPlugin permissions
    children:
      chatplugin.admin: true
      chatplugin.color: true
      chatplugin.formatting: true
      chatplugin.url: true
      chatplugin.mention: true
      chatplugin.bypass.cooldown: true
    default: op
  
  chatplugin.admin:
    description: Access to admin commands
    children:
      chatplugin.admin.reload: true
      chatplugin.admin.info: true
      chatplugin.admin.test: true
      chatplugin.admin.format: true
      chatplugin.admin.toggle: true
    default: op
  
  chatplugin.admin.reload:
    description: Reload plugin configuration
    default: op
  
  chatplugin.admin.info:
    description: View plugin information
    default: op
  
  chatplugin.admin.test:
    description: Test chat formatting
    default: op
  
  chatplugin.admin.format:
    description: Manage chat formats
    default: op
  
  chatplugin.admin.toggle:
    description: Toggle plugin features
    default: op
  
  chatplugin.color:
    description: Use color codes in chat
    default: true
  
  chatplugin.formatting:
    description: Use text formatting in chat
    default: true
  
  chatplugin.url:
    description: Post clickable URLs in chat
    default: true
  
  chatplugin.mention:
    description: Mention other players in chat
    default: true
  
  chatplugin.bypass.cooldown:
    description: Bypass chat cooldown
    default: op
  
  # Format-specific permissions
  chatplugin.format.admin:
    description: Use admin chat format
    default: op
  
  chatplugin.format.moderator:
    description: Use moderator chat format
    default: false
  
  chatplugin.format.vip:
    description: Use VIP chat format
    default: false
  
  # Private messaging permissions
  chatplugin.message:
    description: Permission to send and receive private messages
    default: true
  
  # Chat toggle permissions
  chatplugin.toggle:
    description: All chat toggle permissions
    children:
      chatplugin.toggle.chat: true
      chatplugin.toggle.messages: true
    default: true
  
  chatplugin.toggle.chat:
    description: Permission to toggle public chat on/off
    default: true
  
  chatplugin.toggle.messages:
    description: Permission to toggle private messages on/off
    default: true
  
  chatplugin.status:
    description: Permission to view chat status
    default: true
  
  # Social spy permissions
  chatplugin.socialspy:
    description: Permission to use social spy to monitor private messages
    default: op
  
  chatplugin.commandspy:
    description: Permission to use command spy to monitor player commands
    default: op
  
  # Additional bypass permissions
  chatplugin.bypass.chattoggle:
    description: Bypass chat toggle restrictions (staff can always chat)
    default: op
  
  chatplugin.bypass.messagetoggle:
    description: Bypass message toggle restrictions (staff can always message)
    default: op
  
  chatplugin.viewinventory:
    description: Permission to view inventory snapshots from placeholders
    default: true

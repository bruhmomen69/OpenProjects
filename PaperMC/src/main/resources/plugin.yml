name: ZealousChat
main: bruh.zchat.paper.PaperMC
version: ${version}
api-version: '1.20'
author: bruhmomen69
description: A highly configurable kyori adventure (minimessage) powered chat formatting plugin
load: STARTUP
libraries:
  - org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.0.0
  - org.spongepowered:configurate-hocon:4.1.2
  - io.github.revxrsal:lamp.common:4.0.0-rc.12
  - io.github.revxrsal:lamp.bukkit:4.0.0-rc.12
  - io.github.revxrsal:lamp.brigadier:4.0.0-rc.12
  - com.mysql:mysql-connector-j:9.5.0
  - org.xerial:sqlite-jdbc:3.47.1.0
  - com.zaxxer:HikariCP:7.0.2
  - com.github.shynixn.mccoroutine:mccoroutine-folia-api:2.22.0
  - com.github.shynixn.mccoroutine:mccoroutine-folia-core:2.22.0

softdepend:
  - PlaceholderAPI

commands:
  chatplugin:
    description: Main command ZealousChat
    usage: /chatplugin <subcommand>
    permission: zchat.admin
    aliases: [chatformat, zealouschat, zchat]

  msg:
    description: Send a private message to another player
    usage: /msg <player> <message>
    permission: zchat.message
    aliases: [message, tell, whisper, w]
  
  reply:
    description: Reply to the last player who sent you a message
    usage: /reply <message>
    permission: zchat.message
    aliases: [r]

permissions:
  zchat.*:
    description: All ChatPlugin permissions
    children:
      zchat.admin: true
      zchat.color: true
      zchat.formatting: true
      zchat.url: true
      zchat.mention: true
      zchat.bypass.cooldown: true
      zchat.bypass.swearfilter: true
    default: op
  
  zchat.admin:
    description: Access to admin commands
    children:
      zchat.admin.reload: true
      zchat.admin.info: true
      zchat.admin.test: true
      zchat.admin.format: true
      zchat.admin.toggle: true
      zchat.admin.block: true
    default: op
  
  zchat.admin.reload:
    description: Reload plugin configuration
    default: op
  
  zchat.admin.info:
    description: View plugin information
    default: op
  
  zchat.admin.test:
    description: Test chat formatting
    default: op
  
  zchat.admin.format:
    description: Manage chat formats
    default: op
  
  zchat.admin.toggle:
    description: Toggle plugin features
    default: op
  
  zchat.admin.block:
    description: Manage player block lists
    default: op
  
  zchat.color:
    description: Use color codes in chat
    default: true
  
  zchat.formatting:
    description: Use text formatting in chat
    default: true
  
  zchat.url:
    description: Post clickable URLs in chat
    default: true
  
  zchat.mention:
    description: Mention other players in chat
    default: true
  
  zchat.bypass.cooldown:
    description: Bypass chat cooldown
    default: op
  
  zchat.bypass.swearfilter:
    description: Bypass swear filter restrictions
    default: op
  
  # Format-specific permissions
  zchat.format.admin:
    description: Use admin chat format
    default: op
  
  zchat.format.moderator:
    description: Use moderator chat format
    default: false
  
  zchat.format.vip:
    description: Use VIP chat format
    default: false
  
  # Private messaging permissions
  zchat.message:
    description: Permission to send and receive private messages
    default: true
  
  # Chat toggle permissions
  zchat.toggle:
    description: All chat toggle permissions
    children:
      zchat.toggle.chat: true
      zchat.toggle.messages: true
    default: true
  
  zchat.toggle.chat:
    description: Permission to toggle public chat on/off
    default: true
  
  zchat.toggle.messages:
    description: Permission to toggle private messages on/off
    default: true
  
  zchat.status:
    description: Permission to view chat status
    default: true
  
  # Social spy permissions
  zchat.socialspy:
    description: Permission to use social spy to monitor private messages
    default: op
  
  zchat.commandspy:
    description: Permission to use command spy to monitor player commands
    default: op
  
  # Additional bypass permissions
  zchat.bypass.chattoggle:
    description: Bypass chat toggle restrictions (staff can always chat)
    default: op
  
  zchat.bypass.messagetoggle:
    description: Bypass message toggle restrictions (staff can always message)
    default: op
  
  zchat.viewinventory:
    description: Permission to view inventory snapshots from placeholders
    default: true
  
  zchat.inventory.placeholders:
    description: Permission to use inventory placeholders in chat
    default: true
